# FairLane Phase 2a-fix3 Matrix Pre-Registration Specification
# Status: [Phase 2a-fix3 Pre-Registration]
# Pre-registered and committed before running the Phase 2a-fix3 matrix.
#
# Evaluation Dimensions & Hypotheses:
# 1. Capacity Calibration & Load Sweep:
#    - Capacity: C_measured ~ 20,778 weighted tok/s (17,867 raw tok/s) under continuous batching (B=16, KV=16384).
#    - 1a. Heterogeneous Load Sweep (50%, 80%, 95%, 120%):
#          At <=120% load, FIFO ~= VTC on TTFT. At 120% load, DRR is worse for Chat due to quantum burstiness.
#          FIFO and VTC are identical to 0.1 ms at 80% because queue depth is <=1; VTC does NOT fall through to FIFO.
#    - 1b. Noisy Neighbor Load Sweep: Victim ~20% of measured capacity, Flooder at 50%, 100%, 200%, 400%.
#          Horizon (45s) is long enough for FIFO queue growth, demonstrating severe FIFO victim degradation vs VTC isolation.
#
# 2. DRR vs VTC Equivalence & Advanced Scenarios:
#    - Equivalence: DRR and VTC achieve identical steady-state shares (~50.0% weighted) under overload.
#    - 2a. Windowed Variance: 1-second windowed share variance shows no statistically significant trend across
#          Q in {256, 512, 1024, 2048} within 95% CIs (~0.003 - 0.004).
#    - 2b. On/Off Returning Tenant: Return window W_return = [18.0s, 23.0s] (first N=5.0s after return).
#          LiftMode=none control allows returning tenant to monopolize the server in first 5s.
#          VTC (LiftMode=artifact/paper) and DRR (deficit reset) prevent starvation (continuous TTFT <= 300ms).
#    - 2c. 3-Tenant Weighted Sharing: Under weights w = [3.0, 2.0, 1.0], both DRR and VTC converge to 50% : 33.3% : 16.7%.
#
# 3. Predictor Study Under Heavy-Tailed Outputs (Overload with Both Tenants Backlogged):
#    - Workload: Overload with Chat 50 req/s, RAG 10 req/s (both backlogged).
#    - Metric: Continuous counter error |c_with_predictor(t) - c_oracle(t)| evaluated per tenant.
#    - 3a. Completion Correction Robustness: With completion correction, steady-state share remains ~50.0%.
#    - 3b. Timeout Scenario: 15% cancelled requests drop completion correction (counts tracked). Underpredicting tenants escape charges.
#    - 3c. Predict-Never-Correct Bound: Without completion correction, prediction bias translates into permanent share distortion.
#
# 4. Engine In-Flight Cap K Sweep (Overload Scenario):
#    - Evaluated under overload with both tenants backlogged.
#    - Measured Max Engine Queue Length is logged empirically (K-B formula removed).
#    - K=4 underutilizes the server (75% batch idle).
#    - K=16 (K=B) achieves minimum victim TTFT.
#    - For K >= 192, identical results occur because maximum accumulated queue depth never reaches 192 during the run.
#    - K=16 share was 24.9% in fix2 because load was under-demanding (Chat demand was only 23%).
#
# 5. Priority Bands (Strict Inter-Tier Priority):
#    - Preemption semantics: Non-preemptive Execution with Strict Head-of-Queue Priority Admission (Tier 0 heads admitted first).
#    - Table includes FIFO baseline alongside Flat VTC and Priority Bands at 80% and 100% load.

matrix_name: "phase2a_fix3_matrix_preregistration"
version: "3.0.0"
design_status: "phase2a-fix3-final"
seed_start: 200
seeds_count: 30
confidence_interval: 0.95

simulation:
  horizon_us: 30000000 # 30 seconds
  warmup_us:   5000000 # 5 seconds warm-up discarded
  noisy_neighbor_horizon_us: 45000000 # 45s for deep queue growth

server:
  max_batch_size: 16
  kv_capacity_tokens: 16384
  base_step_time_us: 5000
  per_token_cost_us: 5

measured_capacity:
  wtd_tokens_per_sec: 20778.2
  raw_tokens_per_sec: 17867.5

load_sweep_heterogeneous:
  loads: [0.50, 0.80, 0.95, 1.20]
  policies: ["fifo", "drr", "vtc"]

load_sweep_noisy_neighbor:
  victim_load_ratio: 0.20 # 20% of capacity
  flooder_load_ratios: [0.50, 1.00, 2.00, 4.00]
  policies: ["fifo", "drr", "vtc"]

drr_advanced:
  quantums: [256, 512, 1024, 2048]
  window_slice_sec: 1.0
  three_tenant_weights:
    tenant_a: 3.0 # target 50.0%
    tenant_b: 2.0 # target 33.3%
    tenant_c: 1.0 # target 16.7%
  returning_tenant:
    continuous_tenant: "chat"
    on_off_tenant: "rag"
    idle_start_sec: 8.0
    idle_end_sec: 18.0
    return_window_sec: 5.0 # [18.0s, 23.0s]
    modes: ["lift_artifact", "lift_paper", "lift_none", "drr"]

predictor_study:
  chat_rate: 50.0
  rag_rate: 10.0
  distribution: "lognormal"
  chat: { median: 64, sigma: 0.75, min: 8, max: 512 }
  rag:  { median: 128, sigma: 0.75, min: 16, max: 1024 }
  cancellation_rate: 0.15

gateway_k_sweep:
  chat_rate: 50.0
  rag_rate: 10.0
  cap_k_values: [4, 16, 64, 96, 128, 192, 256, 10000]

priority_bands:
  tier0: "chat"
  tier1: "rag"
  preemption_running: false
  admission_priority: "strict_head_of_queue"
  loads: [0.80, 1.00]
  policies: ["fifo", "flat_vtc", "priority_bands"]

validation_criteria:
  load_sweep:
    unsaturated_50pct_share_min: 0.22
    unsaturated_50pct_share_max: 0.26
    drr_120pct_chat_ttft_ratio_vs_vtc_min: 1.15
  noisy_neighbor:
    fifo_slowdown_400pct_min: 100.0 # FIFO victim slowdown >= 100x vs solo
    vtc_victim_ttft_400pct_max_ms: 250.0 # VTC bounds victim TTFT <= 250ms under 400% flooder
    fifo_vs_vtc_slowdown_ratio_min: 50.0 # FIFO is >= 50x worse than VTC
  on_off_returning:
    lift_none_return_share_min: 0.70
    continuous_ttft_lift_artifact_max_ms: 600.0
  predictor_study:
    oracle_chat_error_max: 0.001
    oracle_rag_error_max: 0.001
    completion_correction_share_min: 0.48
    completion_correction_share_max: 0.52
    timeouts_fired_min: 50
    dropped_corrections_min: 50
    never_correct_pos_bias_share_max: 0.46
    never_correct_neg_bias_share_min: 0.52
  gateway_k_sweep:
    k4_engine_batch_idle_min: 0.70
    k16_ttft_lower_than_k_unbounded: true
  priority_bands:
    tier0_ttft_priority_vs_flat_reduction_min_pct: 40.0
