# FairLane Phase 2a Matrix Pre-Registration Specification
# Pre-registered before running Phase 2a benchmark suite.
#
# Evaluation Dimensions:
# 1. DRR Quantum & Weight Sweep:
#    - Base quantum Q in {256, 512, 1024, 2048} with equal weights (1.0 : 1.0)
#    - Weighted DRR with Chat:RAG = 2.0 : 1.0 (Q=512)
#    - Hypothesis: DRR token quantum affects batch granularity and TTFT jitter, but NOT long-run share.
#      Under completion-corrected weighted token charging (w_in=1, w_out=2), long-run weighted share is ~50.0% (raw ~43.5%).
#
# 2. Predictor Study Under Heavy-Tailed Outputs:
#    - Log-normal heavy-tailed output distribution:
#        Chat: median 64 tokens, sigma 0.75, range [8, 512]
#        RAG:  median 128 tokens, sigma 0.75, range [16, 1024]
#    - Predictors: Oracle, Mean-per-tenant, Noisy-Oracle (sigma in {0.3, 0.6}, bias in {-0.25, 0.0, +0.25, +0.50})
#    - Metrics: Chat weighted/raw share, Chat victim TTFT (mean/p95), Counter Drift (MAE vs actual token usage).
#    - Hypothesis: Completion correction preserves ~50% long-run fair share regardless of prediction error,
#      but prediction bias/variance increases interim counter drift and victim TTFT jitter.
#
# 3. Gateway In-Flight Cap K Sweep:
#    - K in {4, 16, 64, 256, unbounded}
#    - Server max batch size B = 16, KV cache = 16384 tokens.
#    - Hypothesis: When K <= B (K in {4, 16}), requests are held in the fair gateway queue and admitted just-in-time,
#      yielding minimal victim TTFT. When K > B (K in {64, 256, unbounded}), excess requests sit in the engine's internal
#      FIFO queue, bypassing fair gateway reordering and degrading victim TTFT towards unmanaged FIFO.
#
# 4. Capacity Load Sweep (~50%, 80%, 95%, 120% Capacity):
#    - Policies: FIFO, DRR (Q=512), VTC (incremental)
#    - Capacity Definition: Nominal load (1.0 = 100%) represents continuous batching saturation where arrival token
#      rate (Chat: 50 req/s, RAG: 10 req/s = 50,880 raw tok/s) matches sustained token service capacity of engine.
#    - Load scale scales arrival rates proportionally.
#    - Caveat: Cross-policy TTFT comparisons reflect both queuing discipline and unequal allocated service shares.
#
# 5. Priority-Band Experiment:
#    - Tier 0 (High Priority, Chat Premium) vs Tier 1 (Best Effort, RAG Batch)
#    - Strict inter-tier priority scheduling with intra-tier VTC/DRR fairness.
#    - Hypothesis: Tier 0 experiences zero head-of-line blocking from Tier 1, achieving minimal TTFT.

matrix_name: "phase2a_matrix_preregistration"
version: "1.0.0"
seeds: [12345, 23456, 34567, 45678, 56789]
seeds_count: 5
confidence_interval: 0.95

simulation:
  horizon_us: 30000000 # 30 seconds
  warmup_us:   5000000 # 5 seconds warm-up discarded

server:
  max_batch_size: 16
  kv_capacity_tokens: 16384
  base_step_time_us: 5000
  per_token_cost_us: 5

drr_quantum_sweep:
  quantums: [256, 512, 1024, 2048]
  input_weight: 1.0
  output_weight: 2.0
  weighted_run:
    quantum: 512
    weights:
      chat: 2.0
      rag: 1.0

predictor_study:
  distribution: "lognormal"
  chat:
    median_output: 64
    sigma: 0.75
    min_output: 8
    max_output: 512
  rag:
    median_output: 128
    sigma: 0.75
    min_output: 16
    max_output: 1024
  variants:
    - name: "oracle"
      type: "oracle"
    - name: "mean-prior"
      type: "mean"
      prior: 64
    - name: "noisy-oracle (sigma=0.3, bias=0.0)"
      type: "noisy-oracle"
      sigma: 0.3
      bias: 0.0
    - name: "noisy-oracle (sigma=0.3, bias=+25%)"
      type: "noisy-oracle"
      sigma: 0.3
      bias: 0.25
    - name: "noisy-oracle (sigma=0.3, bias=-25%)"
      type: "noisy-oracle"
      sigma: 0.3
      bias: -0.25
    - name: "noisy-oracle (sigma=0.6, bias=0.0)"
      type: "noisy-oracle"
      sigma: 0.6
      bias: 0.0
    - name: "noisy-oracle (sigma=0.6, bias=+50%)"
      type: "noisy-oracle"
      sigma: 0.6
      bias: 0.50

gateway_k_sweep:
  cap_k_values: [4, 16, 64, 256, 10000] # 10000 represents unbounded

load_sweep:
  loads: [0.50, 0.80, 0.95, 1.20]
  policies: ["fifo", "drr", "vtc"]

priority_band_experiment:
  tiers:
    - priority: 0
      name: "Tier 0 (Interactive Premium)"
      tenant: "chat"
    - priority: 1
      name: "Tier 1 (Batch Best-Effort)"
      tenant: "rag"
