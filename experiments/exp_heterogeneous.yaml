# FairLane Experiment 2: Heterogeneous Request Sizing Under Permanent Backlog
# Thesis: When tenants have asymmetric token lengths (Chat 128 tokens vs RAG 4k tokens),
# request-count round-robin severely starves the small tenant in token throughput.
# Token-aware scheduling (VTC) is required to equalize token allocation.
#
# Pre-committed Hypotheses:
# 1. FIFO: With interleaved arrivals under permanent backlog, request dispatch follows arrival ordering.
#    Because RAG requests are ~21.5x larger (4128 tokens vs 192 tokens), RAG will monopolize >90% of token share.
# 2. Round-Robin: Grants exact 50% request share (1:1 alternating). Consequently, RAG captures
#    ~4128 / (4128 + 192) = 95.5% of total tokens served, while Chat receives only ~4.5% token share.
# 3. VTC: By tracking accumulated virtual tokens, VTC dispatches ~21.5 Chat requests for every 1 RAG request,
#    equalizing long-run per-tenant token throughput toward 50% / 50% (+/- 5%).

experiment_name: "exp_heterogeneous"
seeds_count: 30
seed_start: 200

server:
  kv_capacity_tokens: 16384 # Sufficient capacity to hold concurrent 4k RAG prompts
  max_batch_size: 16
  base_step_time_us: 5000   # 5 ms base step time
  per_token_cost_us: 5      # 5 µs per active token

sliding_window_tokens: 2000

workload:
  permanent_backlog: true
  tenants:
    - tenant_id: "chat"
      request_count: 200
      arrival_process: "periodic"
      mean_interval_us: 1000 # tightly packed arrivals ensuring permanent backlog
      prompt_length_min: 128
      prompt_length_max: 128
      output_length_min: 64
      output_length_max: 64

    - tenant_id: "rag"
      request_count: 50
      arrival_process: "periodic"
      mean_interval_us: 4000 # tightly packed arrivals ensuring permanent backlog
      prompt_length_min: 4000
      prompt_length_max: 4000
      output_length_min: 128
      output_length_max: 128

policies:
  - name: "fifo"
  - name: "round-robin"
  - name: "vtc"
    w_in: 1.0
    w_out: 2.0
    lift_mode: "artifact"
    lift_timing: "arrival"
    charging_model: "incremental"
