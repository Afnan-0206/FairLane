# FairLane Experiment 2: Steady-State Heterogeneous Sizing Under Overload
# Topology: Two permanently backlogged tenants with heterogeneous request sizes:
#   - Chat: prompt 128, decode 64 (raw 192 tok, weighted 256 tok with w_in=1, w_out=2)
#   - RAG:  prompt 4000, decode 128 (raw 4128 tok, weighted 4256 tok with w_in=1, w_out=2)
# Both tenants submit Poisson arrivals at rates exceeding their fair share of server capacity:
#   - Chat: 50 req/s (Poisson, mean interval 20ms)
#   - RAG:  10 req/s (Poisson, mean interval 100ms)
# Execution runs over a fixed horizon of 60.0s, discarding a 10.0s warm-up period.
# Service metrics are evaluated strictly within the measurement window where BOTH tenants are backlogged.
#
# Pre-committed Hypotheses:
# 1. Round-Robin Hand-Calc Prediction [Pre-registered]: Under strict 1:1 request dispatch (N_chat = N_rag),
#    Chat weighted token share is 256 / (256 + 4256) = 256 / 4512 ~ 5.67% (~5.7%).
#    Raw token share is 192 / (192 + 4128) = 192 / 4320 ~ 4.44%.
#    [Pilot-Informed Hedge]: Under continuous batching, if KV capacity or cursor bypass restricts
#    concurrent RAG admissions, Chat may capture additional batch slots, elevating empirical share above 5.7%.
# 2. VTC Hand-Calc Prediction [Pre-registered]: By balancing virtual token counters (c_chat ~ c_rag),
#    VTC will schedule ~16.6 Chat requests for every 1 RAG request, targeting:
#    Chat Weighted Token Share ~ 50.0% (+/- 5%) and RAG Weighted Token Share ~ 50.0% (+/- 5%).
#    Chat Raw Token Share ~ (16.625 * 192) / (16.625 * 192 + 4128) = 3192 / 7320 ~ 43.6%.
# 3. FIFO Prediction [Pre-registered]: Earliest arrivals monopolize continuous batch slots, leaving Chat with <5% token share.

experiment_name: "exp_heterogeneous_steady_state"
seeds_count: 30
seed_start: 200

simulation:
  horizon_us: 60000000 # 60 seconds fixed horizon
  warmup_us:  10000000 # 10 seconds discarded warm-up

server:
  kv_capacity_tokens: 16384
  max_batch_size: 16
  base_step_time_us: 5000 # 5 ms base step
  per_token_cost_us: 5    # 5 µs per token in batch

workload:
  tenants:
    - tenant_id: "chat"
      request_count: 4000 # 80s of arrivals (past 60s horizon)
      arrival_process: "poisson"
      mean_interval_us: 20000 # 50 req/s
      prompt_length_min: 128
      prompt_length_max: 128
      output_length_min: 64
      output_length_max: 64

    - tenant_id: "rag"
      request_count: 800 # 80s of arrivals (past 60s horizon)
      arrival_process: "poisson"
      mean_interval_us: 100000 # 10 req/s
      prompt_length_min: 4000
      prompt_length_max: 4000
      output_length_min: 128
      output_length_max: 128

policies:
  - name: "fifo"
  - name: "round-robin"
  - name: "vtc"
    w_in: 1.0
    w_out: 2.0
    lift_mode: "artifact"
    lift_timing: "arrival"
    charging_model: "incremental"
